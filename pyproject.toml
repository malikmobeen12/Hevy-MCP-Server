[project]
name = "hevy-trainer"
version = "0.1.0"
description = "Hevy Personal Trainer MCP Server - AI fitness coach using your workout data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Open Source Contributor"}
]
keywords = ["mcp", "fitness", "hevy", "workout", "ai", "llm"]
dependencies = [
    "mcp<2",
    "matplotlib>=3.0.0",
    "seaborn>=0.13.0",
    "duckduckgo-search>=6.0.0",
    "pytest>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/your-username/Hevy-Trainer"
Repository = "https://github.com/your-username/Hevy-Trainer.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hevy_trainer"]
